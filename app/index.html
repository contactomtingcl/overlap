<!DOCTYPE html>
<!-- Written with AI assistance (Claude, Anthropic); reviewed by the Overlap team. See docs/AI_USE.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050d24">
<meta name="description" content="25 years of NASA FIRMS hotspots from MODIS and VIIRS, harmonized into one comparable burning activity calendar for Chile.">
<meta property="og:title" content="Overlap · two satellites, one honest burning calendar">
<meta property="og:image" content="assets/logo-512.png">
<link rel="alternate" hreflang="es" href="?lang=es">
<link rel="icon" type="image/png" href="assets/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<title>Overlap · Harmonized burning activity calendar</title>
<style>
  :root {
    --bg:#050d24; --card:rgba(12,27,60,.78); --card2:rgba(18,38,80,.6); --line:rgba(140,180,255,.14);
    --ink:#eaf1ff; --quiet:#8fa6cc; --blue:#0197f8; --blue2:#0971c8; --lime:#eaff28; --slate:#1e3847;
    --high:#ff8a3d; --low:#4db8ff; --normal:#c9d6ea;
    --head:"Space Grotesk", "Inter", system-ui, sans-serif;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  html { background:#040a1c; }
  body { margin:0; font-family:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); line-height:1.45;
    background:
      radial-gradient(1100px 620px at 92% -12%, rgba(1,151,248,.32), transparent 62%),
      radial-gradient(800px 500px at -5% 8%, rgba(9,113,200,.22), transparent 60%),
      linear-gradient(180deg, #071536 0, #040a1c 1400px) no-repeat;
    min-height:100vh; }
  a { color:var(--low); }
  /* header with the logo's crossing bands: coarse MODIS pixels and fine VIIRS dots */
  header { position:relative; overflow:hidden; }
  .bands { position:absolute; inset:-40% -10% auto auto; width:620px; height:620px; pointer-events:none; opacity:.55;
    -webkit-mask:radial-gradient(closest-side, #000 30%, transparent); mask:radial-gradient(closest-side, #000 30%, transparent); }
  .bands i { position:absolute; left:50%; top:50%; width:150%; height:92px; transform-origin:center; }
  .bands .modis { transform:translate(-50%,-50%) rotate(45deg);
    background:repeating-conic-gradient(#1e3847 0 25%, #12222f 0 50%) 0 0/46px 46px;
    animation:inModis 1.4s cubic-bezier(.16,1,.3,1) both, drift 18s linear 1.4s infinite; }
  .bands .viirs { transform:translate(-50%,-50%) rotate(-45deg);
    background:radial-gradient(circle, #0a3b78 1.6px, transparent 2px) 0 0/7px 7px;
    animation:inViirs 1.4s cubic-bezier(.16,1,.3,1) .15s both, drift 9s linear 1.5s infinite reverse; }
  .bands b { position:absolute; left:50%; top:50%; width:66px; height:66px; transform:translate(-50%,-50%) rotate(45deg);
    background:var(--lime); border-radius:3px;
    animation:ignite .9s cubic-bezier(.2,.9,.2,1.3) 1.05s both, breathe 3.2s ease-in-out 2s infinite; }
  @keyframes inModis { from { transform:translate(-50%,-50%) rotate(45deg) translateX(-110%); opacity:0; } }
  @keyframes inViirs { from { transform:translate(-50%,-50%) rotate(-45deg) translateX(110%); opacity:0; } }
  @keyframes drift { to { background-position:184px 0; } }
  @keyframes ignite { from { transform:translate(-50%,-50%) rotate(45deg) scale(0); box-shadow:0 0 0 0 rgba(234,255,40,0); }
    60% { box-shadow:0 0 120px 40px rgba(234,255,40,.9); } to { box-shadow:0 0 40px 10px rgba(234,255,40,.55); } }
  @keyframes breathe { 50% { box-shadow:0 0 70px 22px rgba(234,255,40,.75); } }
  .brand img { animation:logoIn .9s cubic-bezier(.16,1,.3,1) both, logoGlow 3.2s ease-in-out 2s infinite; }
  @keyframes logoIn { from { opacity:0; transform:scale(.6) rotate(-12deg); } }
  @keyframes logoGlow { 50% { box-shadow:0 0 0 1px rgba(234,255,40,.35), 0 6px 40px rgba(234,255,40,.35); } }
  h1, .tag { animation:rise .9s cubic-bezier(.16,1,.3,1) .25s both; }
  .tag { animation-delay:.4s; }
  @keyframes rise { from { opacity:0; transform:translateY(14px); filter:blur(6px); } }
  /* cards: scroll reveal + cursor spotlight */
  .reveal { opacity:0; transform:translateY(26px); transition:opacity .8s cubic-bezier(.16,1,.3,1), transform .8s cubic-bezier(.16,1,.3,1); }
  .reveal.in { opacity:1; transform:none; }
  .card { position:relative; isolation:isolate; }
  .card::before { content:""; position:absolute; inset:-1px; border-radius:inherit; z-index:-1; pointer-events:none; opacity:0; transition:opacity .3s;
    background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%), rgba(1,151,248,.16), transparent 45%); }
  .card::after { content:""; position:absolute; inset:-1px; border-radius:inherit; pointer-events:none; opacity:0; transition:opacity .3s; padding:1px;
    background:radial-gradient(300px circle at var(--mx,50%) var(--my,50%), rgba(234,255,40,.55), transparent 50%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; }
  .card:hover::before, .card:hover::after { opacity:1; }
  /* live dot, headline glow, scan line */
  .live { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--lime); margin-right:8px; vertical-align:1px;
    box-shadow:0 0 0 0 rgba(234,255,40,.7); animation:ping 1.8s ease-out infinite; }
  @keyframes ping { 70% { box-shadow:0 0 0 10px rgba(234,255,40,0); } 100% { box-shadow:0 0 0 0 rgba(234,255,40,0); } }
  .headline .lvl { text-shadow:0 0 22px currentColor; animation:glowText 3s ease-in-out infinite; }
  @keyframes glowText { 50% { text-shadow:0 0 6px currentColor; } }
  .scan { animation:scan 1.3s cubic-bezier(.4,0,.2,1) both; }
  @keyframes scan { from { transform:translateY(0); opacity:1; } 85% { opacity:1; } to { transform:translateY(var(--h)); opacity:0; } }
  .gauge i { transition:left 1.4s cubic-bezier(.16,1,.3,1) .3s; }
  .reveal-chart { transform:scaleX(0); transform-origin:left; transform-box:fill-box; }
  .in .reveal-chart { animation:wipe 2s cubic-bezier(.65,0,.35,1) .2s forwards; }
  @keyframes wipe { to { transform:scaleX(1); } }
  .wrap { max-width:1180px; margin:auto; padding:0 24px; }
  .brand { position:relative; display:flex; gap:16px; align-items:center; padding:28px 0 6px; }
  .brand img { width:58px; height:58px; border-radius:14px; box-shadow:0 0 0 1px var(--line), 0 6px 30px rgba(1,151,248,.35); }
  h1 { margin:0; font-family:var(--head); font-size:30px; letter-spacing:-.02em; line-height:1.1; }
  h1 em { font-style:normal; color:var(--lime); text-shadow:0 0 18px rgba(234,255,40,.45); }
  .lang { margin-left:auto; display:inline-flex; background:#0d1f45; border:1px solid var(--line); border-radius:10px; padding:3px; align-self:flex-start; }
  .lang button { border:0; background:transparent; padding:5px 10px; border-radius:7px; color:var(--quiet); font-size:13px; font-weight:600; }
  .lang button[aria-pressed="true"] { background:var(--blue); color:#fff; }
  .tag { position:relative; color:var(--quiet); margin:8px 0 18px; max-width:760px; }
  main { display:grid; grid-template-columns:minmax(0,1fr); gap:16px; padding-bottom:40px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 20px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 10px 40px rgba(0,0,0,.25); }
  h2 { font-family:var(--head); font-size:18px; margin:0 0 4px; letter-spacing:-.01em; }
  .sub { color:var(--quiet); font-size:13.5px; margin:0 0 12px; }
  /* controls */
  .controls { display:flex; flex-wrap:wrap; gap:12px 18px; align-items:center; position:sticky; top:8px; z-index:4; padding:12px 16px; }
  .field { display:flex; gap:8px; align-items:center; font-size:13px; color:var(--quiet); }
  select, button { font:inherit; font-size:14px; padding:8px 12px; border:1px solid var(--line); border-radius:10px;
    background:#0d1f45; color:var(--ink); }
  select { max-width:100%; min-width:0; }
  #aoi { width:250px; }
  button { cursor:pointer; transition:border-color .2s, background .2s, color .2s; }
  button:hover, select:hover { border-color:rgba(234,255,40,.5); }
  .seg { display:inline-flex; background:#0d1f45; border:1px solid var(--line); border-radius:12px; padding:3px; }
  .seg button { border:0; background:transparent; padding:6px 12px; border-radius:9px; color:var(--quiet); }
  .seg button[aria-pressed="true"] { background:var(--lime); color:#0a1430; font-weight:600; box-shadow:0 0 16px rgba(234,255,40,.35); }
  .seg button.raw[aria-pressed="true"] { background:#5a6f93; color:#fff; box-shadow:none; }
  .spacer { flex:1; }
  /* headline */
  .headline { font-family:var(--head); font-size:clamp(22px, 3.2vw, 34px); line-height:1.15; margin:2px 0 6px; letter-spacing:-.02em; }
  .headline .lvl { padding:0 .1em; }
  .status { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:12px; margin-top:14px; }
  .kpi { background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .kpi b { display:block; font-family:var(--head); font-size:26px; letter-spacing:-.01em; }
  .kpi small { color:var(--quiet); font-size:12.5px; }
  .gauge { position:relative; height:8px; border-radius:6px; margin:10px 0 4px;
    background:linear-gradient(90deg, var(--low), #2a3d63 35%, #2a3d63 65%, var(--high)); }
  .gauge i { position:absolute; top:50%; width:14px; height:14px; border-radius:50%; transform:translate(-50%,-50%);
    background:var(--ink); box-shadow:0 0 0 3px #0a1430, 0 0 14px rgba(255,255,255,.6); }
  /* calendar */
  #calendar { width:100%; overflow-x:auto; }
  #calendar svg { display:block; }
  .cell { cursor:pointer; transition:fill .7s ease, opacity .2s; }
  .cell:hover { stroke:var(--lime); stroke-width:1.5; }
  .pop { animation:pop .5s cubic-bezier(.2,.8,.2,1.2) both; transform-box:fill-box; transform-origin:center; }
  @keyframes pop { from { opacity:0; transform:scale(.4); } }
  .legend { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; font-size:12.5px; color:var(--quiet); margin-top:12px; }
  .ramp { display:inline-flex; align-items:center; gap:6px; }
  .ramp i { display:inline-block; width:150px; height:10px; border-radius:6px; }
  .sw { display:inline-block; width:14px; height:14px; border-radius:4px; vertical-align:-2px; margin-right:5px; border:1px solid var(--line); }
  .ico { display:inline-block; width:16px; height:16px; vertical-align:-3px; margin-right:5px; border-radius:3px; }
  .ico.modis { background:repeating-conic-gradient(#4d6b85 0 25%, #22384a 0 50%) 0 0/8px 8px; }
  .ico.viirs { background:radial-gradient(circle, #4db8ff 1.1px, transparent 1.4px) 0 0/4px 4px #0d2a52; }
  /* jump chart */
  #jump svg, #season svg { display:block; width:100%; height:auto; }
  .bigfig { display:flex; flex-wrap:wrap; gap:10px 28px; margin:4px 0 10px; }
  .bigfig div { font-size:13px; color:var(--quiet); }
  .bigfig b { display:block; font-family:var(--head); font-size:28px; color:var(--ink); }
  .bigfig .good b { color:var(--lime); text-shadow:0 0 14px rgba(234,255,40,.35); }
  /* day grid */
  #day-grid { display:grid; grid-template-columns:repeat(7, minmax(34px, 64px)); gap:5px; }
  .day { border-radius:7px; height:44px; font-size:12px; padding:3px 6px; color:var(--ink); border:1px solid var(--line); }
  .day b { display:block; font-size:12.5px; }
  .dow { font-size:12px; color:var(--quiet); text-align:center; }
  /* trust */
  .tablewrap { overflow-x:auto; }
  table.trust { border-collapse:collapse; width:100%; font-size:13px; min-width:560px; }
  table.trust th, table.trust td { border-bottom:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top; }
  table.trust th { color:var(--quiet); font-weight:600; }
  .ok { color:var(--lime); font-weight:600; }
  /* notes */
  details.card summary { cursor:pointer; font-family:var(--head); font-size:18px; font-weight:600; list-style:none; }
  details.card summary::after { content:"＋"; float:right; color:var(--quiet); }
  details.card[open] summary::after { content:"－"; }
  details.card summary::-webkit-details-marker { display:none; }
  .notes p { color:var(--quiet); font-size:13.5px; }
  .notes b { color:var(--ink); }
  #tip { position:fixed; pointer-events:none; background:rgba(6,14,36,.96); border:1px solid rgba(234,255,40,.35); color:var(--ink);
    font-size:12.5px; padding:9px 11px; border-radius:10px; display:none; max-width:290px; line-height:1.45; z-index:9; box-shadow:0 10px 30px rgba(0,0,0,.5); }
  #tip b { color:var(--lime); }
  footer { color:var(--quiet); font-size:12.5px; padding-bottom:30px; }
  @media (max-width:620px) {
    .wrap { padding:0 14px; }
    h1 { font-size:21px; }
    .brand { padding-top:58px; }
    .lang { position:absolute; top:14px; right:0; }
    .brand img { width:46px; height:46px; }
    .card { padding:14px; border-radius:14px; }
    .controls { position:static; }
    .field { width:100%; }
    .field select, #aoi { flex:1; width:auto; }
    .spacer { display:none; }
    .kpi b { font-size:22px; }
    .bands { width:360px; height:360px; opacity:.3; inset:-30% -30% auto auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
    .reveal { opacity:1; transform:none; } .reveal-chart { transform:none; } html { scroll-behavior:auto; } }
</style>
</head>
<body>
<header>
  <div class="bands" aria-hidden="true"><i class="viirs"></i><i class="modis"></i><b></b></div>
  <div class="wrap">
    <div class="brand">
      <img src="assets/logo-160.png" alt="Overlap logo" data-i18n-alt="logo_alt">
      <h1 data-i18n="title"></h1>
      <div class="lang" role="group" aria-label="Language / Idioma">
        <button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="es" aria-pressed="false">ES</button>
      </div>
    </div>
    <p class="tag" data-i18n="tag"></p>
  </div>
</header>
<main class="wrap">
  <section class="card controls" data-i18n-label="controls">
    <label class="field"><span data-i18n="area"></span> <select id="aoi"></select></label>
    <label class="field"><span data-i18n="rows"></span> <select id="rows"><option value="season" data-i18n="opt_season"></option><option value="year" data-i18n="opt_year"></option></select></label>
    <div class="seg" role="group">
      <button type="button" id="mode-h" aria-pressed="true" data-i18n="mode_h"></button>
      <button type="button" id="mode-r" class="raw" aria-pressed="false" data-i18n="mode_r"></button>
    </div>
    <span class="spacer"></span>
    <button id="csv" type="button" data-i18n="csv"></button>
  </section>

  <section class="card">
    <p class="sub" id="status-kicker"></p>
    <p class="headline" id="headline"></p>
    <p class="sub" id="status-sub"></p>
    <div class="status" id="status"></div>
  </section>

  <section class="card">
    <h2 data-i18n="season_h"></h2>
    <p class="sub" id="season-sub"></p>
    <div class="bigfig" id="season-figs"></div>
    <div id="season"></div>
    <div class="legend" id="season-legend"></div>
  </section>

  <section class="card">
    <h2 data-i18n="cal_h"></h2>
    <p class="sub" id="cal-sub"></p>
    <div id="calendar"></div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="card" id="day-panel" hidden>
    <h2 id="day-title"></h2>
    <p class="sub" id="day-sub"></p>
    <div id="day-grid"></div>
    <div class="legend" id="day-legend"></div>
  </section>

  <section class="card">
    <h2 data-i18n="jump_h"></h2>
    <p class="sub" data-i18n="jump_sub"></p>
    <div class="bigfig" id="jump-figs"></div>
    <div id="jump"></div>
    <div class="legend" id="jump-legend"></div>
  </section>

  <section class="card">
    <h2 data-i18n="trust_h"></h2>
    <p class="sub" data-i18n="trust_sub"></p>
    <div id="trust"></div>
  </section>

  <details class="card notes">
    <summary data-i18n="read_h"></summary>
    <p id="method"></p>
    <p data-i18n="read_nodetect"></p>
    <p data-i18n="read_notfire"></p>
    <p data-i18n="read_wip"></p>
  </details>

  <footer data-i18n="footer"></footer>
</main>
<div id="tip" role="tooltip"></div>
<script src="app.js"></script>
</body>
</html>
